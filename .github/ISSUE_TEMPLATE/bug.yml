name: Something is broken
description: Knotwork did something it shouldn't, or didn't do something it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Please **don't paste real guest names, emails or dietary requirements** here, in text or in a screenshot. To show the problem, use the guided tour's example wedding, or invent people.

        A security problem (one account reading another's wedding, a guest link showing more than one seat) belongs in a private report instead: go back and choose **Report a security problem**.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exact error text if there was one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, starting from which page. "It happened while I was moving tables" is still useful.
      placeholder: |
        1. Open Seating
        2. Drag a guest onto Table 4
        3. ...
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Safari on an iPhone, Chrome on Windows...
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - The hosted site, signed in
        - The hosted site, not signed in
        - My own copy
    validations:
      required: true
