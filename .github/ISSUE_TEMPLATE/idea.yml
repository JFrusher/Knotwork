name: An idea
description: Something Knotwork could do for a wedding.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before writing, please check [ROADMAP.md](https://github.com/JFrusher/Knotwork/blob/main/ROADMAP.md). It may already be planned, or ruled out on purpose: see **Not planned, on purpose**. A paid tier, RSVP collection and an admin panel that can browse weddings will be closed with a pointer there.
  - type: textarea
    id: job
    attributes:
      label: The job
      description: Start from what you needed to get done, not the solution. "I needed to know who was bringing the cake stand" beats "add a cake stand field".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: A spreadsheet, a note on your phone, nothing at all.
